name: Build DeX Bridge Win64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout DeX Bridge
        uses: actions/checkout@v4

      - name: Checkout scrcpy 4.1
        run: git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git scrcpy

      - name: Apply DeX Bridge patches
        run: |
          set -euxo pipefail
          python3 tools/patch_dex_bridge.py
          python3 tools/patch_bridge_state_machine.py

      - name: Verify bridge implementation
        run: |
          set -euxo pipefail
          grep -q "dex_bridge_active" scrcpy/app/src/screen.h
          grep -q "SC_EVENT_DEX_BRIDGE_TICK" scrcpy/app/src/events.h
          grep -q "sc_input_manager_dex_bridge_tick" scrcpy/app/src/input_manager.c
          grep -q "WINDOWS -> DEX" scrcpy/app/src/input_manager.c
          grep -q "DEX -> WINDOWS" scrcpy/app/src/input_manager.c
          grep -q "UHID stays connected" scrcpy/app/src/screen.c

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y meson ninja-build nasm mingw-w64 mingw-w64-tools libz-mingw-w64-dev zip

      - name: Build scrcpy client for Windows x64
        working-directory: scrcpy
        timeout-minutes: 22
        run: |
          set -euxo pipefail
          echo "[DeX Bridge] starting official scrcpy 4.1 Windows x64 build"
          stdbuf -oL -eL release/build_windows.sh 64
          echo "[DeX Bridge] build finished"

      - name: Package transparent test bundle
        run: |
          set -euxo pipefail
          mkdir -p package/bin package/source-patches
          cp -a scrcpy/release/work/build-win64/dist/. package/bin/
          cp README.md package/DEX-BRIDGE-README.md
          cp tools/patch_dex_bridge.py tools/patch_bridge_state_machine.py package/source-patches/
          cat > package/VERIFY-BEFORE-RUNNING.txt <<'EOF'
          DeX Bridge test build
          =====================
          This bundle was built by GitHub Actions from scrcpy v4.1 plus the source patches included
          in source-patches/. It is an unsigned development build, so Windows or a browser may warn
          about reputation. Do not disable antivirus or SmartScreen globally.

          SHA256SUMS.txt contains SHA-256 hashes for every executable/DLL in bin/.
          The GitHub Actions artifact itself also has a GitHub-provided SHA-256 digest in the run metadata.
          EOF
          (cd package && find bin -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -r DeX-Bridge-Test-win64.zip package
          sha256sum DeX-Bridge-Test-win64.zip > DeX-Bridge-Test-win64.zip.sha256
          ls -lah DeX-Bridge-Test-win64.zip*

      - name: Upload verification package
        uses: actions/upload-artifact@v4
        with:
          name: DeX-Bridge-Test-Package
          path: |
            DeX-Bridge-Test-win64.zip
            DeX-Bridge-Test-win64.zip.sha256
          if-no-files-found: error
