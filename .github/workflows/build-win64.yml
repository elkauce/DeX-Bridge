name: Build DeX Bridge Win64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeX Bridge
        uses: actions/checkout@v4

      - name: Checkout scrcpy 4.1
        run: git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git scrcpy

      - name: Apply DeX Bridge patch
        run: python3 tools/patch_dex_bridge.py

      - name: Verify patch
        run: |
          grep -q "dex_bridge_active" scrcpy/app/src/screen.h
          ! grep -q '^[[:space:]]*sc_mouse_capture_set_active(&screen->mc, true);' scrcpy/app/src/screen.c
          grep -q "event->xrel" scrcpy/app/src/input_manager.c

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build scrcpy client for Windows x64
        working-directory: scrcpy
        run: release/build_windows.sh 64

      - name: Package intermediate engine
        run: |
          mkdir -p artifact
          cp -a scrcpy/release/work/build-win64/dist/. artifact/
          cp README.md artifact/DEX-BRIDGE-README.md

      - name: Upload DeX Bridge Engine
        uses: actions/upload-artifact@v4
        with:
          name: DeX-Bridge-Engine-win64
          path: artifact/
          if-no-files-found: error
